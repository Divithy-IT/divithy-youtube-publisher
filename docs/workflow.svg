<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Przepływ pracy Divithy Publisher</title>
  <desc id="desc">Paczki materiałów są sprawdzane, układane w harmonogram i publikowane przez YouTube API.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#15102a"/></linearGradient></defs>
  <rect width="960" height="250" rx="24" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial" text-anchor="middle" fill="#f5f7ff">
    <g><rect x="35" y="65" width="190" height="120" rx="18" fill="#19233e" stroke="#39e7ff"/><text x="130" y="112" font-size="22" font-weight="700">Paczki filmów</text><text x="130" y="143" font-size="15" fill="#b9c4dc">film + 3 shortsy</text></g>
    <text x="260" y="132" font-size="30" fill="#39e7ff">→</text>
    <g><rect x="295" y="65" width="190" height="120" rx="18" fill="#19233e" stroke="#b166ff"/><text x="390" y="112" font-size="22" font-weight="700">Planer</text><text x="390" y="143" font-size="15" fill="#b9c4dc">gry + typy + strefa</text></g>
    <text x="520" y="132" font-size="30" fill="#b166ff">→</text>
    <g><rect x="555" y="65" width="170" height="120" rx="18" fill="#19233e" stroke="#ff4fc8"/><text x="640" y="112" font-size="22" font-weight="700">OAuth 2.0</text><text x="640" y="143" font-size="15" fill="#b9c4dc">zgoda właściciela</text></g>
    <text x="760" y="132" font-size="30" fill="#ff4fc8">→</text>
    <g><rect x="795" y="65" width="130" height="120" rx="18" fill="#19233e" stroke="#ff4f64"/><text x="860" y="112" font-size="22" font-weight="700">YouTube</text><text x="860" y="143" font-size="15" fill="#b9c4dc">API v3</text></g>
  </g>
</svg>
